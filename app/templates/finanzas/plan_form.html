{% extends "base_admin.html" %}
{% block title %}{{ 'Editar' if plan else 'Nuevo' }} plan financiero{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-start mb-4"><div><h3 class="mb-1">{{ 'Editar' if plan else 'Nuevo' }} plan financiero</h3></div><a class="btn btn-outline-secondary" href="{{ url_for('finanzas.planes') }}">Volver</a></div>
<div class="card shadow-sm"><div class="card-body"><form method="post" class="row g-3"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="col-md-4"><label class="form-label">Código</label><input class="form-control" name="codigo" maxlength="50" value="{{ form.codigo }}" required></div>
  <div class="col-md-6"><label class="form-label">Nombre</label><input class="form-control" name="nombre" maxlength="120" value="{{ form.nombre }}" required></div>
  <div class="col-md-2"><label class="form-label">Orden</label><input class="form-control" name="orden" type="number" value="{{ form.orden }}"></div>
  <div class="col-md-12"><label class="form-label">Objetivo</label><input class="form-control" name="objetivo" maxlength="255" value="{{ form.objetivo }}"></div>
  <div class="col-md-12"><label class="form-label">Descripción</label><textarea class="form-control" name="descripcion" rows="3">{{ form.descripcion }}</textarea></div>
  <div class="col-12"><button class="btn btn-primary" type="submit">Guardar</button></div>
</form></div></div>
{% endblock %}
